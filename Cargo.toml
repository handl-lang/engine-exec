[package]
name = "hnl-engine-exec"
version = "0.1.0"
edition = "2024"
description = "The abstraction crate for the eval operation (ADR-0044 §3, §4, §7)."
license = "MIT"
repository = "https://github.com/handl-lang/engine-exec"
homepage = "https://handl-lang.github.io/docs/engine-exec/"
documentation = "https://handl-lang.github.io/docs/engine-exec/reference/"
readme = "README.md"
keywords = ["handl", "engine", "eval", "interpreter", "language-as-data"]
categories = ["development-tools", "compilers"]
# Git-install only: https://github.com/handl-lang/engine-exec (no crates.io).
publish = false

[dependencies]
handl-language = { git = "https://github.com/handl-lang/kernel", branch = "main" }
handl-platform = { git = "https://github.com/handl-lang/host", branch = "main" }
handl-value = { git = "https://github.com/handl-lang/kernel", branch = "main" }
serde_json = "1"
rustc-hash = "2"
stacker = "0.1"

[dev-dependencies]
handl-plugin-module = { git = "https://github.com/handl-lang/host", branch = "main" }

